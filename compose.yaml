# Self-hosted uptime monitoring: Uptime Kuma behind Caddy (automatic HTTPS) + daily backups.
name: monitoring

services:
  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
    # no published ports: only reachable through Caddy
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [kuma]
    networks: [internal]

  backup:
    image: alpine:3
    restart: unless-stopped
    environment:
      - KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_HOUR=${BACKUP_HOUR:-2}
    volumes:
      - kuma-data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "--loop"]
    networks: [internal]

volumes:
  kuma-data:
  caddy-data:
  caddy-config:

networks:
  internal:
